<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa 3D Model Test</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #050505;
        font-family: Arial, sans-serif;
        color: white;
    }

    #status {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        padding: 12px 18px;
        background: rgba(0,0,0,0.75);
        border: 1px solid #555;
        border-radius: 8px;
        font-size: 16px;
    }
</style>
</head>

<body>

<div id="status">🎅 Loading Santa...</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050505);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 2, 8);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);


/* =========================
   LIGHTING
========================= */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambientLight);


const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(5, 10, 5);

scene.add(mainLight);


/* =========================
   CONTROLS
========================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;


/* =========================
   LOAD SANTA
========================= */

const loader = new GLTFLoader();

loader.load(

    "santa_-_norad_santa_tracker_SMALL.glb",

    function(gltf) {

        const santa = gltf.scene;

        scene.add(santa);


        /* Find model size */

        const box = new THREE.Box3().setFromObject(santa);

        const size = box.getSize(new THREE.Vector3());

        const center = box.getCenter(new THREE.Vector3());


        /* Center model */

        santa.position.x -= center.x;
        santa.position.y -= center.y;
        santa.position.z -= center.z;


        /* Automatically scale model */

        const maxSize = Math.max(
            size.x,
            size.y,
            size.z
        );

        const scale = 5 / maxSize;

        santa.scale.setScalar(scale);


        /* Slight starting rotation */

        santa.rotation.y = Math.PI;


        document.getElementById("status").innerHTML =
            "🎅 Santa loaded! 🛷";


        console.log("Santa model loaded successfully!");

    },

    function(xhr) {

        if (xhr.total) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            document.getElementById("status").innerHTML =
                "🎅 Loading Santa... " +
                Math.round(percent) +
                "%";

        }

    },

    function(error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            "❌ Santa could not load.<br>" +
            "Make sure the SMALL GLB is beside index.html.";

    }

);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================
   ANIMATION LOOP
========================= */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
